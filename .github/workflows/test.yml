name: DataPilot checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_DB: datapilot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d datapilot"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PYTHONUTF8: '1'
      DATAPILOT_LLM_MODE: fake
      DATAPILOT_RUN_DB_TESTS: '1'
      DATAPILOT_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:ci-admin-only@localhost:5432/datapilot
      DATAPILOT_OWNER_DATABASE_URL: postgresql+psycopg://datapilot_owner:ci-owner-only@localhost:5432/datapilot
      DATAPILOT_SEED_DATABASE_URL: postgresql+psycopg://datapilot_seed:ci-seed-only@localhost:5432/datapilot
      DATAPILOT_READER_DATABASE_URL: postgresql+psycopg://datapilot_reader:ci-reader-only@localhost:5432/datapilot
      DATAPILOT_OWNER_PASSWORD: ci-owner-only
      DATAPILOT_SEED_PASSWORD: ci-seed-only
      DATAPILOT_READER_PASSWORD: ci-reader-only
      DATAPILOT_INGEST_PASSWORD: ci-ingest-only
      DATAPILOT_UPLOAD_READER_PASSWORD: ci-upload-reader-only
      DATAPILOT_REGISTRY_PASSWORD: ci-registry-only
      DATAPILOT_REGISTRY_DATABASE_URL: postgresql+psycopg://datapilot_registry:ci-registry-only@localhost:5432/datapilot
      DATAPILOT_INGEST_DATABASE_URL: postgresql+psycopg://datapilot_ingest:ci-ingest-only@localhost:5432/datapilot
      DATAPILOT_UPLOAD_READER_DATABASE_URL: postgresql+psycopg://datapilot_upload_reader:ci-upload-reader-only@localhost:5432/datapilot
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked datapilot db-init
      - run: uv run --locked datapilot migrate
      - run: uv run --locked datapilot seed
      - run: uv run --locked datapilot health
      - run: uv run --locked pytest --cov=datapilot --cov-report=term-missing
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .

name: DataPilot CI Final Migration — 31 Cases — NOT FULL CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    name: ci-final-migration-31 (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_DB: datapilot_test_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d datapilot_test_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PYTHONUTF8: '1'
      DATAPILOT_LLM_MODE: fake
      DATAPILOT_RUN_DB_TESTS: '1'
      DATAPILOT_TEST_ISOLATED: '1'
      DATAPILOT_P7_ISOLATED: '1'
      DATAPILOT_RUN_LIVE_TESTS: '0'
      DATAPILOT_API_KEY: ''
      DATAPILOT_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:ci-admin-only@localhost:5432/datapilot_test_ci
      DATAPILOT_OWNER_DATABASE_URL: postgresql+psycopg://datapilot_owner:ci-owner-only@localhost:5432/datapilot_test_ci
      DATAPILOT_SEED_DATABASE_URL: postgresql+psycopg://datapilot_seed:ci-seed-only@localhost:5432/datapilot_test_ci
      DATAPILOT_READER_DATABASE_URL: postgresql+psycopg://datapilot_reader:ci-reader-only@localhost:5432/datapilot_test_ci
      DATAPILOT_OWNER_PASSWORD: ci-owner-only
      DATAPILOT_SEED_PASSWORD: ci-seed-only
      DATAPILOT_READER_PASSWORD: ci-reader-only
      DATAPILOT_INGEST_PASSWORD: ci-ingest-only
      DATAPILOT_UPLOAD_READER_PASSWORD: ci-upload-reader-only
      DATAPILOT_REGISTRY_PASSWORD: ci-registry-only
      DATAPILOT_RUNTIME_PASSWORD: ci-runtime-only
      DATAPILOT_CHECKPOINT_OWNER_PASSWORD: ci-checkpoint-owner-only
      DATAPILOT_RAG_INGEST_PASSWORD: ci-rag-ingest-only
      DATAPILOT_RAG_READER_PASSWORD: ci-rag-reader-only
      DATAPILOT_WEB_PASSWORD: ci-web-only
      DATAPILOT_MAINTENANCE_PASSWORD: ci-maintenance-only
      DATAPILOT_WEB_DATABASE_URL: postgresql+psycopg://datapilot_web:ci-web-only@localhost:5432/datapilot_test_ci
      DATAPILOT_MAINTENANCE_DATABASE_URL: postgresql+psycopg://datapilot_maintenance:ci-maintenance-only@localhost:5432/datapilot_test_ci
      DATAPILOT_RAG_INGEST_DATABASE_URL: postgresql+psycopg://datapilot_rag_ingest:ci-rag-ingest-only@localhost:5432/datapilot_test_ci
      DATAPILOT_RAG_READER_DATABASE_URL: postgresql+psycopg://datapilot_rag_reader:ci-rag-reader-only@localhost:5432/datapilot_test_ci
      DATAPILOT_RUNTIME_DATABASE_URL: postgresql+psycopg://datapilot_runtime:ci-runtime-only@localhost:5432/datapilot_test_ci
      DATAPILOT_CHECKPOINT_OWNER_DATABASE_URL: postgresql+psycopg://datapilot_checkpoint_owner:ci-checkpoint-owner-only@localhost:5432/datapilot_test_ci
      DATAPILOT_REGISTRY_DATABASE_URL: postgresql+psycopg://datapilot_registry:ci-registry-only@localhost:5432/datapilot_test_ci
      DATAPILOT_INGEST_DATABASE_URL: postgresql+psycopg://datapilot_ingest:ci-ingest-only@localhost:5432/datapilot_test_ci
      DATAPILOT_UPLOAD_READER_DATABASE_URL: postgresql+psycopg://datapilot_upload_reader:ci-upload-reader-only@localhost:5432/datapilot_test_ci
    steps:
      - uses: actions/checkout@v4
      - name: Prepare evidence identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci
          git rev-parse HEAD > artifacts/ci/commit.txt
          printf '%s\n' '{"scope":"ci-final-migration-31","full_ci":false,"planned_pg_tests":31}' > artifacts/ci/test-scope.json
          git ls-files -z | xargs -0 sha256sum -- > artifacts/ci/source-sha256.txt
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked 2>&1 | tee artifacts/ci/dependencies.log
      - name: Collect exact test identities
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python -m pytest --collect-only -q -p no:cacheprovider 2>&1 | tee artifacts/ci/nodeids.txt
      - name: Unit and protocol regressions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python -m pytest -m "not integration and not live" -p no:cacheprovider --junitxml=artifacts/ci/unit.xml --cov=datapilot --cov-report=term-missing 2>&1 | tee artifacts/ci/unit.log
      - name: Initialize disposable PostgreSQL and pinned model
        id: initialize
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            uv run --locked datapilot db-init
            uv run --locked datapilot migrate
            uv run --locked datapilot runtime-init
            uv run --locked datapilot seed
            uv run --locked datapilot health
            uv run --locked datapilot rag model-fetch
          } 2>&1 | tee artifacts/ci/initialize.log
      - name: CI Final Migration 31 exact PG cases - NOT FULL CI
        if: ${{ !cancelled() && steps.initialize.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python -m pytest -m integration \
            'tests/test_cross_source_postgres.py::test_five_independent_business_cases_real_sources_and_p3_gold[paid_invoice_revenue-\u5206\u6790\u5df2\u652f\u4ed8\u8d26\u5355\u6536\u5165\u5e76\u89e3\u91ca\u8d26\u5355\u53e3\u5f84-\u5df2\u4ed8\u6b3e\u8d26\u5355\u6536\u5165\u548c\u7ecf\u5e38\u6027\u8ba2\u9605\u91d1\u989d\u6709\u4ec0\u4e48\u533a\u522b\uff1f-300]' \
            'tests/test_cross_source_postgres.py::test_five_independent_business_cases_real_sources_and_p3_gold[customer_churn-\u8ba1\u7b97\u671f\u521d\u5ba2\u6237\u961f\u5217\u51c0\u6d41\u5931\u7387\u5e76\u63d0\u4f9b\u53e3\u5f84\u6765\u6e90-\u5ba2\u6237\u6d41\u5931\u4e0e\u8ba2\u9605\u53d6\u6d88\u7684\u671f\u521d\u961f\u5217\u53e3\u5f84-0.4]' \
            'tests/test_cross_source_postgres.py::test_five_independent_business_cases_real_sources_and_p3_gold[subscription_churn-\u8ba1\u7b97\u8ba2\u9605\u5408\u540c\u6d41\u5931\u7387\u5e76\u9644\u4e1a\u52a1\u5b9a\u4e49-\u8ba2\u9605\u5408\u540c\u6d41\u5931\u4e0e\u964d\u7ea7\u5982\u4f55\u533a\u5206\uff1f-0.666666666667]' \
            'tests/test_cross_source_postgres.py::test_five_independent_business_cases_real_sources_and_p3_gold[usage-\u6c47\u603b\u4ea7\u54c1\u4f7f\u7528\u91cf\u5e76\u8bf4\u660e\u4e8b\u4ef6\u6570\u91cf\u9650\u5236-\u4ea7\u54c1\u4f7f\u7528\u4e8b\u4ef6\u6570\u91cf\u548c\u6d3b\u8dc3\u7528\u6237\u6570\u6709\u4ec0\u4e48\u533a\u522b\uff1f-35]' \
            'tests/test_cross_source_postgres.py::test_five_independent_business_cases_real_sources_and_p3_gold[active_subscriptions-\u6838\u5bf9\u65f6\u70b9\u6d3b\u8dc3\u5408\u540c\u5e76\u5f15\u7528\u8ba2\u9605\u5386\u53f2\u8981\u6c42-\u6d3b\u8dc3\u8ba2\u9605\u5408\u540c\u7684\u65f6\u70b9\u53e3\u5f84\u4e0e\u5386\u53f2\u6570\u636e\u8981\u6c42\u662f\u4ec0\u4e48\uff1f-4]' \
            'tests/test_cross_source_postgres.py::test_rag_and_metric_references_survive_cross_node_checkpoint' \
            'tests/test_cross_source_postgres.py::test_prompt_injection_source_and_denied_tool_do_not_approve_report' \
            'tests/test_document_fact_postgres.py::test_real_worker_receipt_report_and_persistent_fact_coverage[absence]' \
            'tests/test_document_fact_postgres.py::test_real_worker_receipt_report_and_persistent_fact_coverage[partial]' \
            'tests/test_document_fact_postgres.py::test_real_worker_receipt_report_and_persistent_fact_coverage[summary]' \
            'tests/test_document_fact_postgres.py::test_real_worker_receipt_report_and_persistent_fact_coverage[causal]' \
            'tests/test_host_goal_postgres.py::test_new_public_ownership_report_chain[bge-complete]' \
            'tests/test_host_goal_postgres.py::test_new_public_ownership_report_chain[bge-partial]' \
            'tests/test_host_goal_postgres.py::test_new_public_ownership_report_chain[bge-causal]' \
            'tests/test_host_goal_postgres.py::test_new_goal_cross_process_restore_preserves_receipt_and_budget[bge]' \
            'tests/test_host_goal_safety_postgres.py::test_goal_and_business_eligibility_remain_separate[bge-complete-completed]' \
            'tests/test_host_goal_safety_postgres.py::test_goal_and_business_eligibility_remain_separate[bge-negative-completed]' \
            'tests/test_host_goal_safety_postgres.py::test_goal_and_business_eligibility_remain_separate[bge-partial-partial]' \
            'tests/test_host_goal_safety_postgres.py::test_goal_and_business_eligibility_remain_separate[bge-required_gap-partial]' \
            'tests/test_host_goal_safety_postgres.py::test_goal_and_business_eligibility_remain_separate[bge-causal-partial]' \
            'tests/test_host_goal_safety_postgres.py::test_cross_process_v3_reuse_or_v2_identity_rejection[bge-False]' \
            'tests/test_original_query_postgres.py::test_real_original_query_report_and_terminal_reuse[cp12]' \
            'tests/test_original_query_postgres.py::test_call_and_feedback_cut_points_do_not_reissue_search_or_settle_twice[worker_model_committed]' \
            'tests/test_original_query_postgres.py::test_call_and_feedback_cut_points_do_not_reissue_search_or_settle_twice[tool_committed]' \
            'tests/test_original_query_postgres.py::test_call_and_feedback_cut_points_do_not_reissue_search_or_settle_twice[rag_submission_committed]' \
            'tests/test_original_query_postgres.py::test_call_and_feedback_cut_points_do_not_reissue_search_or_settle_twice[report_artifact_committed]' \
            'tests/test_original_query_postgres.py::test_model_selected_second_search_and_its_committed_feedback_are_reused' \
            'tests/test_partial_evidence_postgres.py::test_partial_refs_restore_across_node_checkpoint' \
            'tests/test_phase12_postgres.py::test_explicit_false_report_survives_real_sources_and_readonly_inspection' \
            'tests/test_rag_completion_postgres.py::test_real_semantic_retrieval_checks_original_goal_not_model_search_keywords[True]' \
            'tests/test_rag_completion_postgres.py::test_committed_rag_control_restores_across_process_without_duplicate_calls[semantic-rag_submission_committed-3]' \
            -p no:cacheprovider --junitxml=artifacts/ci/integration.xml --cov=datapilot --cov-append --cov-report=term-missing --cov-report=xml:artifacts/ci/coverage.xml 2>&1 | tee artifacts/ci/integration.log
      - name: Ruff lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked ruff check . 2>&1 | tee artifacts/ci/ruff.log
      - name: Python format check
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked ruff format --check src tests scripts migrations evaluation 2>&1 | tee artifacts/ci/format.log
      - name: Preserve logs JUnit and identities on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: datapilot-checks-py${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/
          if-no-files-found: error
          include-hidden-files: false
